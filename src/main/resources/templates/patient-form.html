
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Form - CarePoint HMS</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: #f3f7fc;
        }

        .form-header {
            background: linear-gradient(120deg, #102a43, #087e8b);
            padding: 28px;
            border-radius: 16px;
            color: white;
            margin-bottom: 25px;
        }

        .form-header h1 {
            color: white;
            margin: 0 0 9px;
            font-size: 28px;
        }

        .form-header p {
            color: #dbeafe;
            margin: 0;
            font-size: 14px;
        }

        .patient-form {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(16,42,67,0.07);
            border: 1px solid #e5edf5;
        }

        .form-section-title {
            color: #102a43;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #edf1f5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d4deea;
            border-radius: 9px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: #fbfdff;
            color: #172033;
            outline: none;
            transition: 0.2s;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #087e8b;
            background: white;
            box-shadow: 0 0 0 3px rgba(8,126,139,0.10);
        }

        .field textarea {
            resize: vertical;
        }

        .field small {
            display: block;
            color: #dc2626;
            font-size: 12px;
            margin-top: 6px;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            padding-top: 22px;
            border-top: 1px solid #edf1f5;
        }

        .save-btn {
            background: #087e8b;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-btn:hover {
            background: #066773;
            transform: translateY(-2px);
        }

        .cancel-btn {
            background: #f1f5f9;
            color: #475569;
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #e2e8f0;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .patient-form {
                padding: 22px;
            }

            .form-header {
                padding: 23px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container narrow">

    <!-- Header -->
    <section class="form-header">

        <h1 th:text="${patient.id == null ? 'Add New Patient' : 'Edit Patient'}">
            Add New Patient
        </h1>

        <p>
            Enter patient details carefully to maintain hospital records.
        </p>

    </section>

    <!-- Patient Form -->
    <form class="patient-form"
          th:action="@{/patients/save}"
          th:object="${patient}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <h2 class="form-section-title">Patient Information</h2>

        <div class="form-grid">

            <div class="field">
                <label>Full Name *</label>

                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter full name"
                       required>

                <small th:errors="*{name}"></small>
            </div>

            <div class="field">
                <label>Phone Number *</label>

                <input type="text"
                       th:field="*{phone}"
                       maxlength="10"
                       placeholder="Enter 10 digit phone number"
                       required>

                <small th:errors="*{phone}"></small>
            </div>

            <div class="field">
                <label>Gender *</label>

                <select th:field="*{gender}" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <small th:errors="*{gender}"></small>
            </div>

            <div class="field">
                <label>Date of Birth</label>

                <input type="date" th:field="*{dateOfBirth}">
            </div>

            <div class="field full">
                <label>Address</label>

                <textarea th:field="*{address}"
                          rows="4"
                          placeholder="Enter complete patient address"></textarea>

                <small th:errors="*{address}"></small>
            </div>

        </div>

        <!-- Buttons -->
        <div class="form-actions">

            <button class="save-btn"
                    type="submit"
                    th:text="${patient.id == null ? 'Save Patient' : 'Update Patient'}">
                Save Patient
            </button>

            <a class="cancel-btn" th:href="@{/patients}">
                Cancel
            </a>

        </div>

    </form>

</main>

</body>
</html>
