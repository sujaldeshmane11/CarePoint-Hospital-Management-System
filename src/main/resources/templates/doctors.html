
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - CarePoint HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .doctor-header {
            background: linear-gradient(120deg, #102a43, #087e8b);
            padding: 30px;
            border-radius: 16px;
            color: white;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .doctor-header h1 {
            color: white;
            margin: 0 0 8px;
        }

        .doctor-header p {
            color: #dbeafe;
            margin: 0;
            font-size: 14px;
        }

        .add-doctor {
            background: white;
            color: #087e8b;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .doctor-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .doctor-summary h2 {
            color: #102a43;
            font-size: 19px;
            margin: 0;
        }

        .doctor-count {
            background: #e0f2f1;
            color: #087e8b;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 220px;
            padding: 13px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            background: #087e8b;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #334155;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
        }

        .doctor-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        .doctor-table th {
            background: #102a43;
            color: white;
            padding: 16px;
            font-size: 13px;
            white-space: nowrap;
        }

        .doctor-table td {
            padding: 16px;
            border-bottom: 1px solid #edf1f5;
            color: #475569;
            font-size: 13px;
        }

        .doctor-table tbody tr:hover {
            background: #f0fdfa;
        }

        .doctor-id {
            color: #087e8b;
            font-weight: bold;
        }

        .doctor-name {
            color: #102a43;
            font-weight: bold;
        }

        .specialization {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        .availability {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .available {
            background: #dcfce7;
            color: #15803d;
        }

        .not-available {
            background: #fee2e2;
            color: #b91c1c;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-btn {
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 45px !important;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .doctor-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 23px;
            }

            .doctor-header h1 {
                font-size: 27px;
            }

            .doctor-summary {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container">

    <section class="doctor-header">
        <div>
            <h1>Doctor Management</h1>
            <p>View, manage and maintain all doctor records.</p>
        </div>

        <a class="add-doctor" th:href="@{/doctors/new}">
            + Add Doctor
        </a>
    </section>

    <section>

        <div class="doctor-summary">
            <h2>All Doctors</h2>

            <span class="doctor-count">
                Total: <span th:text="${#lists.size(doctors)}">0</span>
            </span>
        </div>

        <form class="search-box" th:action="@{/doctors}" method="get">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search by doctor name or specialization...">

            <button type="submit" class="search-btn">Search</button>

            <a th:href="@{/doctors}" class="clear-btn">Clear</a>

        </form>

        <div class="tablewrap">

            <table class="doctor-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Doctor Name</th>
                        <th>Specialization</th>
                        <th>Phone</th>
                        <th>Availability</th>
                        <th>Timing</th>
                        <th>Working Days</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="d : ${doctors}">

                        <td class="doctor-id" th:text="${d.id}"></td>

                        <td class="doctor-name" th:text="${d.name}"></td>

                        <td>
                            <span class="specialization"
                                  th:text="${d.specialization}">
                            </span>
                        </td>

                        <td th:text="${d.phone}"></td>

                        <td>
                            <span class="availability"
                                  th:classappend="${d.available ? ' available' : ' not-available'}"
                                  th:text="${d.available ? 'Available' : 'Not Available'}">
                            </span>
                        </td>

                        <td>
                            <span th:text="${d.startTime != null ? d.startTime : 'Not Set'}"></span>
                            -
                            <span th:text="${d.endTime != null ? d.endTime : 'Not Set'}"></span>
                        </td>

                        <td th:text="${d.workingDays != null ? d.workingDays : 'Not Set'}"></td>

                        <td>
                            <div class="action-buttons">

                                <a class="edit-btn"
                                   th:href="@{/doctors/edit/{id}(id=${d.id})}">
                                    Edit
                                </a>

                                <form th:action="@{/doctors/delete/{id}(id=${d.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this doctor?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit" class="delete-btn">
                                        Delete
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(doctors)}">
                        <td colspan="8" class="empty">
                            No doctors found. Try another search.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
