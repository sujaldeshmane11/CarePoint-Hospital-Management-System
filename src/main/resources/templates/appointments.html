
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - CarePoint HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .appointment-header {
            background: linear-gradient(120deg, #102a43, #087e8b);
            padding: 28px;
            border-radius: 16px;
            color: white;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .appointment-header h1 {
            color: white;
            margin: 0 0 8px;
        }

        .appointment-header p {
            color: #dbeafe;
            margin: 0;
            font-size: 14px;
        }

        .book-btn {
            background: white;
            color: #087e8b;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .filter-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
            align-items: center;
        }

        .filter-box input,
        .filter-box select {
            flex: 1;
            min-width: 170px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            font-size: 13px;
            outline: none;
        }

        .filter-box input:focus,
        .filter-box select:focus {
            border-color: #087e8b;
        }

        .filter-btn {
            background: #087e8b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #334155;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
        }

        .appointment-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .appointment-summary h2 {
            color: #102a43;
            font-size: 19px;
            margin: 0;
        }

        .total-count {
            background: #e0f2f1;
            color: #087e8b;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .appointment-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        .appointment-table th {
            background: #102a43;
            color: white;
            padding: 15px;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
        }

        .appointment-table td {
            padding: 15px;
            border-bottom: 1px solid #edf1f5;
            color: #475569;
            font-size: 13px;
        }

        .appointment-table tbody tr:hover {
            background: #f0fdfa;
        }

        .appointment-id {
            color: #087e8b;
            font-weight: bold;
        }

        .patient-name {
            color: #102a43;
            font-weight: bold;
        }

        .appointment-time {
            color: #087e8b;
            font-weight: bold;
            white-space: nowrap;
        }

        /* STATUS COLORS */
        .status-pill {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-booked {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-completed {
            background: #dcfce7;
            color: #15803d;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-buttons form {
            margin: 0;
        }

        .edit-btn {
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        .complete-btn {
            background: #dcfce7;
            color: #15803d;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .cancel-btn {
            background: #ffedd5;
            color: #c2410c;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px !important;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .appointment-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-box {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-box input,
            .filter-box select {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container">

    <section class="appointment-header">
        <div>
            <h1>Appointment Management</h1>
            <p>Manage and track all patient appointments.</p>
        </div>

        <a class="book-btn" th:href="@{/appointments/new}">
            + Book Appointment
        </a>
    </section>

    <section class="card">

        <form class="filter-box"
              th:action="@{/appointments}"
              method="get">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search Patient / Doctor Name">

            <input type="date"
                   name="date"
                   th:value="${date}">

            <select name="status">
                <option value="">All Status</option>

                <option value="BOOKED"
                        th:selected="${status == 'BOOKED'}">
                    BOOKED
                </option>

                <option value="COMPLETED"
                        th:selected="${status == 'COMPLETED'}">
                    COMPLETED
                </option>

                <option value="CANCELLED"
                        th:selected="${status == 'CANCELLED'}">
                    CANCELLED
                </option>
            </select>

            <button type="submit" class="filter-btn">
                Apply Filter
            </button>

            <a th:href="@{/appointments}" class="clear-btn">
                Clear
            </a>
        </form>

        <div class="appointment-summary">
            <h2>All Appointments</h2>

            <span class="total-count">
                Total:
                <span th:text="${#lists.size(appointments)}">0</span>
            </span>
        </div>

        <div class="tablewrap">

            <table class="appointment-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="a : ${appointments}">

                        <td class="appointment-id"
                            th:text="${a.id}"></td>

                        <td class="patient-name"
                            th:text="${a.patient.name}"></td>

                        <td th:text="${a.doctor.name}"></td>

                        <td th:text="${a.appointmentDate}"></td>

                        <td class="appointment-time"
                            th:text="${a.appointmentTime != null ? a.appointmentTime : '-'}">
                        </td>

                        <td th:text="${a.reason}"></td>

                        <td>
                            <span class="status-pill"
                                  th:classappend="${a.status == 'COMPLETED' ? ' status-completed' : (a.status == 'CANCELLED' ? ' status-cancelled' : ' status-booked')}"
                                  th:text="${a.status}">
                            </span>
                        </td>

                        <td>
                            <div class="action-buttons">

                                <a class="edit-btn"
                                   th:href="@{/appointments/edit/{id}(id=${a.id})}">
                                    Edit
                                </a>

                                <!-- Complete Button -->
                                <form th:if="${a.status != 'COMPLETED' and a.status != 'CANCELLED'}"
                                      th:action="@{/appointments/complete/{id}(id=${a.id})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit" class="complete-btn">
                                        Complete
                                    </button>
                                </form>

                                <!-- Cancel Button -->
                                <form th:if="${a.status != 'COMPLETED' and a.status != 'CANCELLED'}"
                                      th:action="@{/appointments/cancel/{id}(id=${a.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to cancel this appointment?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit" class="cancel-btn">
                                        Cancel
                                    </button>
                                </form>

                                <!-- Delete Button -->
                                <form th:action="@{/appointments/delete/{id}(id=${a.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this appointment?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit" class="delete-btn">
                                        Delete
                                    </button>
                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="8" class="empty">
                            No appointments found. Try different filters.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
