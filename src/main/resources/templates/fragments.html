
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CarePoint HMS</title>
</head>
<body>

<nav th:fragment="nav" class="navbar">

    <a class="brand" th:href="@{/}">
        CarePoint HMS
    </a>

    <div class="navlinks">

        <a th:href="@{/}">Dashboard</a>

        <a th:href="@{/patients}">Patients</a>

        <a th:href="@{/doctors}">Doctors</a>

        <a th:href="@{/appointments}">Appointments</a>

        <form th:action="@{/logout}" method="post" style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <button type="submit">Logout</button>

        </form>

    </div>

</nav>

</body>
</html>
