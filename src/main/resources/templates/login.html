
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePoint HMS - Admin Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f3ff, #d8e9f7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 550px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(16, 42, 67, 0.15);
        }

        .login-banner {
            background: linear-gradient(145deg, #102a43, #087e8b);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .logo {
            width: 65px;
            height: 65px;
            background: white;
            color: #087e8b;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .login-banner h1 {
            font-size: 35px;
            color: white;
            margin: 0 0 15px;
        }

        .login-banner p {
            color: #dbeafe;
            line-height: 1.7;
            font-size: 15px;
        }

        .login-form-area {
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-area h2 {
            color: #102a43;
            font-size: 29px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-form label {
            display: block;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .login-form input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d4deea;
            border-radius: 9px;
            margin-bottom: 22px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .login-form input:focus {
            border-color: #087e8b;
            box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #066773;
            transform: translateY(-2px);
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .footer-text {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 28px;
        }

        @media (max-width: 700px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .login-banner {
                padding: 30px;
            }

            .login-banner h1 {
                font-size: 27px;
            }

            .login-banner p {
                margin-bottom: 0;
            }

            .login-form-area {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-banner">
        <div class="logo">CP</div>

        <h1>CarePoint HMS</h1>

        <p>
            Hospital Management System
        </p>

        <p>
            Manage patients, doctors and appointments
            with a simple and professional system.
        </p>
    </div>

    <div class="login-form-area">

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to access your admin dashboard.
        </p>

        <p class="error" th:if="${param.error}">
            Invalid Username or Password!
        </p>

        <p class="success" th:if="${param.logout}">
            Logout Successful!
        </p>

        <form class="login-form" th:action="@{/login}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <label>Username</label>

            <input type="text"
                   name="username"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <p class="footer-text">
            © 2026 CarePoint HMS. All rights reserved.
        </p>

    </div>

</div>

</body>
</html>
